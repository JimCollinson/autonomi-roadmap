name: PR preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: roadmap-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Validate and publish production assets
    runs-on: ubuntu-latest
    concurrency:
      group: roadmap-pages-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run security tests
        run: npm run test:security

      - name: Validate roadmap content
        run: npm run validate

      - name: Build standalone preview
        run: npm run preview

      - name: Publish production assets to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          OWNER_LOWER="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          PAGES_DIR="${RUNNER_TEMP}/roadmap-production-pages"
          PAGES_BASE_URL="https://${OWNER_LOWER}.github.io/${NAME}"

          rm -rf "$PAGES_DIR"
          if git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$PAGES_DIR"; then
            echo "Using existing gh-pages branch"
          else
            mkdir -p "$PAGES_DIR"
            cd "$PAGES_DIR"
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            cd - >/dev/null
          fi

          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p content styles
          cp "${GITHUB_WORKSPACE}/content/roadmap.json" content/roadmap.json
          cp "${GITHUB_WORKSPACE}/styles/roadmap.css" styles/roadmap.css
          touch .nojekyll
          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Autonomi roadmap assets and previews</title>
          <h1>Autonomi roadmap assets and previews</h1>
          <h2>Production assets</h2>
          <ul>
            <li><a href="content/roadmap.json">content/roadmap.json</a></li>
            <li><a href="styles/roadmap.css">styles/roadmap.css</a></li>
            <li><a href="manifest.json">manifest.json</a></li>
          </ul>
          <h2>Pull request previews</h2>
          <p>Open a pull request preview under <code>/pr-N/</code>.</p>
          HTML

          UPDATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          python3 - <<PY
          import json
          from pathlib import Path

          manifest = {
              "commit": "${COMMIT_SHA}",
              "updatedAt": "${UPDATED_AT}",
              "assets": {
                  "roadmapJson": {
                      "path": "/${NAME}/content/roadmap.json",
                      "url": "${PAGES_BASE_URL}/content/roadmap.json",
                  },
                  "roadmapCss": {
                      "path": "/${NAME}/styles/roadmap.css",
                      "url": "${PAGES_BASE_URL}/styles/roadmap.css",
                  },
              },
          }
          Path("manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          git add content/roadmap.json styles/roadmap.css manifest.json .nojekyll index.html
          if git diff --cached --quiet; then
            echo "No production asset changes to publish"
          else
            git commit -m "Deploy production roadmap assets for ${COMMIT_SHA}"
            git push origin gh-pages
          fi

  build-preview:
    if: github.event_name == 'pull_request'
    name: Validate and build preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run security tests
        run: npm run test:security

      - name: Validate roadmap content
        run: npm run validate

      - name: Build standalone preview
        run: npm run preview

      - name: Upload standalone preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-preview-pr-${{ github.event.pull_request.number }}
          path: preview/standalone.html
          if-no-files-found: error

  publish-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Publish same-repo preview
    needs: build-preview
    runs-on: ubuntu-latest
    concurrency:
      group: roadmap-pages-gh-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
    steps:
      - name: Download standalone preview artifact
        uses: actions/download-artifact@v4
        with:
          name: roadmap-preview-pr-${{ github.event.pull_request.number }}
          path: downloaded-preview

      - name: Publish preview to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          OWNER_LOWER="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          PREVIEW_DIR="${RUNNER_TEMP}/roadmap-pr-preview-pages"

          rm -rf "$PREVIEW_DIR"
          if git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$PREVIEW_DIR"; then
            echo "Using existing gh-pages branch"
          else
            mkdir -p "$PREVIEW_DIR"
            cd "$PREVIEW_DIR"
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            cd - >/dev/null
          fi

          cd "$PREVIEW_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p "pr-${PR_NUMBER}"
          cp "${GITHUB_WORKSPACE}/downloaded-preview/standalone.html" "pr-${PR_NUMBER}/index.html"
          touch .nojekyll
          cat > index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Autonomi roadmap assets and previews</title>
          <h1>Autonomi roadmap assets and previews</h1>
          <h2>Production assets</h2>
          <ul>
            <li><a href="content/roadmap.json">content/roadmap.json</a></li>
            <li><a href="styles/roadmap.css">styles/roadmap.css</a></li>
            <li><a href="manifest.json">manifest.json</a></li>
          </ul>
          <h2>Pull request previews</h2>
          <p>Open a pull request preview under <code>/pr-N/</code>.</p>
          HTML

          git add "pr-${PR_NUMBER}/index.html" .nojekyll index.html
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
          else
            git commit -m "Deploy roadmap preview for PR ${PR_NUMBER}"
            git push origin gh-pages
          fi

          echo "PREVIEW_URL=https://${OWNER_LOWER}.github.io/${NAME}/pr-${PR_NUMBER}/" >> "$GITHUB_ENV"

      - name: Add preview link to job summary
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        run: |
          {
            echo "## Roadmap PR preview"
            echo
            echo "Preview URL: ${PREVIEW_URL}"
            echo
            echo "If the URL 404s immediately after this job passes, wait for GitHub Pages propagation and refresh. If Pages is not enabled for the gh-pages branch, use the uploaded roadmap-preview artifact instead."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview link on PR
        id: comment-preview
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- roadmap-pr-preview -->'
            const body = `${marker}\nRoadmap preview for this PR:\n\n${process.env.PREVIEW_URL}\n\nThis preview is public if GitHub Pages is public. If it 404s immediately after the workflow passes, wait for GitHub Pages propagation and refresh. Fork PRs do not get deployed previews; use the workflow artifact instead.`
            const {owner, repo} = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.rest.issues.listComments({owner, repo, issue_number, per_page: 100})
            const existing = comments.data.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }

      - name: Report non-blocking PR comment failure
        if: steps.comment-preview.outcome == 'failure'
        run: |
          {
            echo
            echo "### PR comment not posted"
            echo
            echo "The preview was published, but GitHub rejected the bot comment. The workflow requests least-privilege issues:write permission; if comments are still blocked, check the repository Actions workflow token policy. The preview URL above and the uploaded artifact remain the fallback."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    name: Clean up closed PR preview
    runs-on: ubuntu-latest
    concurrency:
      group: roadmap-pages-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Remove preview directory from gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREVIEW_DIR="${RUNNER_TEMP}/roadmap-pr-preview-pages"
          rm -rf "$PREVIEW_DIR"

          if ! git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$PREVIEW_DIR"; then
            echo "No gh-pages branch found; nothing to clean"
            exit 0
          fi

          cd "$PREVIEW_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "pr-${PR_NUMBER}"
          git add -A

          if git diff --cached --quiet; then
            echo "No preview directory to remove"
          else
            git commit -m "Remove roadmap preview for PR ${PR_NUMBER}"
            git push origin gh-pages
          fi
