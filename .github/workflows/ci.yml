name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm run validate
      - run: npm run preview
